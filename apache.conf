<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName ${RAILWAY_PUBLIC_DOMAIN:-localhost}

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SuiteCRM rewrite rules (fallback for when .htaccess is ignored)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /

        # Redirect to install.php if config.php is missing
        RewriteCond %{DOCUMENT_ROOT}/config.php !-f
        RewriteRule ^(.*)$ /install.php [L]

        # Redirect non-existing files/dirs to index.php (front controller)
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php?entryPoint=$1 [QSA,L]
    </IfModule>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
